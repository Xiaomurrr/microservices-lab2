version: "3.8"

services:
  consul:
    image: hashicorp/consul:latest
    command: agent -dev -client=0.0.0.0
    ports:
      - "8500:8500"

  auth-service:
    build: ./auth_service
    depends_on:
      - consul

  catalog-1:
    build: ./catalog_service
    environment:
      - INSTANCE_NAME=catalog-1
    depends_on:
      - consul

  catalog-2:
    build: ./catalog_service
    environment:
      - INSTANCE_NAME=catalog-2
    depends_on:
      - consul

  order-service:
    build: ./order_service
    environment:
      - INSTANCE_NAME=order-1
    depends_on:
      - consul

  # Шлюз ходит напрямую к catalog-1 и order-service по внутренним DNS-именам.
  graphql-gateway:
    build: ./graphql_gateway
    ports:
      - "8005:8000"        # для отладки в обход nginx
    depends_on:
      - order-service
      - catalog-1

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - auth-service
      - catalog-1
      - catalog-2
      - order-service
      - graphql-gateway