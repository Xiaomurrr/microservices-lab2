version: "3.8"

services:
  consul:
    image: hashicorp/consul:latest
    command: agent -dev -client=0.0.0.0
    ports:
      - "8500:8500"

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth-service:
    build: ./auth_service
    depends_on:
      - consul

  catalog-1:
    build: ./catalog_service
    environment:
      - INSTANCE_NAME=catalog-1
    depends_on:
      - consul

  catalog-2:
    build: ./catalog_service
    environment:
      - INSTANCE_NAME=catalog-2
    depends_on:
      - consul

  order-service:
    build: ./order_service
    environment:
      - INSTANCE_NAME=order-1
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
    depends_on:
      - consul
      - rabbitmq

  payment-service:
    build: ./payment_service
    environment:
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
    depends_on:
      - rabbitmq

  notification-service:
    build: ./notification_service
    environment:
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
    depends_on:
      - rabbitmq

  # Шлюз ходит напрямую к catalog-1 и order-service по внутренним DNS-именам.
  graphql-gateway:
    build: ./graphql_gateway
    ports:
      - "8005:8000"
    depends_on:
      - order-service
      - catalog-1

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - auth-service
      - catalog-1
      - catalog-2
      - order-service
      - graphql-gateway